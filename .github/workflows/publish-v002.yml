name: Publish Blobnrool V0.0.2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Add one-time V0.0.2 release publisher'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run regression tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Point V0.0.2 tag at merged source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f V0.0.2 "$GITHUB_SHA"
          git push --force origin refs/tags/V0.0.2
      - name: Attach APK and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload V0.0.2 app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release edit V0.0.2 --prerelease=false --title "Blobnrool V0.0.2" --notes "Blob’n’Roll Android build. Includes the expanded arena and minimap, capture regression tests, custom launcher icon, expressive blob faces, and progressive levels. Built and tested with Android CI."
